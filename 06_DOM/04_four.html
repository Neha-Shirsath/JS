<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: black; color: white;">
    <ul class="language">
        <li>
            Javascript
        </li>
    </ul>
</body>

<script>
    function addLang(langName){
        const li = document.createElement("li");
        li.innerHTML = `${langName}`;
        document.querySelector(".language").appendChild(li);
    }
    addLang("Python")
    addLang("Typescript")//it has to traverse up to end

    //optimized way
    function optAddLan(langName){
        const li = document.createElement("li");
        li.appendChild(document.createTextNode(langName));
        document.querySelector(".language").appendChild(li)
    }
    optAddLan("Golang")

    //Edit
    const lastLang = document.querySelector("li:nth-child(2)");
    //lastLang.innerHTML = "Mojo"
    const newli = document.createElement("li")
    newli.textContent = "Mojo"
    lastLang.replaceWith(newli)

    //edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = "<li>Typescript</li>"

    //remove
    const remLang = document.querySelector("li:nth-child(3)")
    remLang.remove()

</script>
</html>
