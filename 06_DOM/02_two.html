<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: rgb(54, 52, 52); color: white;">
    <div class="Parent">
        <div class="day">Monaday</div>
        <div class="day">Tueday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>

<script>
    const parent = document.querySelector('.Parent')
    console.log(parent);
    console.log(parent.children);//HTML collection
    console.log(parent.children[2]);
    console.log(parent.children[2].innerHTML);

    for (let i = 0; i < parent.children.length; i++) {
        console.log(parent.children[i].innerHTML);
    }

    parent.children[0].style.color="orange"

    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);
        
    const dayOne = document.querySelector(".day")
    console.log(dayOne);
    console.log(dayOne.parentElement);  
    console.log(dayOne.nextElementSibling); 
    
    console.log("Nodes : ",parent.childNodes);//9
    
        
</script>


</html>
